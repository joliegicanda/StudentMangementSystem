<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register Student</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="container">
    <h1>Student Registration</h1>

    <!-- Success message (only shown when successMessage exists) -->
    <p class="success" th:if="${successMessage}" th:text="${successMessage}"></p>

    <!-- Error message from the database (only shown when errorMessage exists) -->
    <p class="error-box" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <!-- th:action = where to send the form, th:object = the Student object the form is bound to -->
    <form th:action="@{/student/register}" th:object="${student}" method="post">

        <label for="firstName">First Name</label>
        <input type="text" id="firstName" th:field="*{firstName}" required>
        <span class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>

        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" th:field="*{lastName}" required>
        <span class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>

        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}" required>
        <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <label for="age">Age</label>
        <input type="number" id="age" th:field="*{age}" min="1" required>
        <span class="error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></span>

        <button type="submit">Submit</button>
    </form>

    <a class="link" th:href="@{/student/all}">View all students</a>
</div>
</body>
</html>
